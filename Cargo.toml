[workspace]
members = ["crates/*", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["xqw <xqw@qq.com>"]
repository = "https://github.com/junwindxqw/fly-ide"
publish = false

[workspace.dependencies]
tauri = { version = "2" }
tauri-build = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
thiserror = "2"
tracing = "0.1"

# release 统一配置：体积小、启动快（Phase 0 基准后按实测调整）
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
